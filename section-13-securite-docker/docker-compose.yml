services:
  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: rabbitmq
    # ports:
    #   - "5672:5672"
    #   - "15672:15672"

  eurekaserver:
    build: ./eurekaserver
    container_name: eurekaserver
    # ports:
    #   - "8761:8761"
    healthcheck:
      test: "curl --fail --silent localhost:8761/actuator/health | grep UP || exit 1"
      interval: 10s
      retries: 10
      start_period: 30s

  configserver:
    build: ./configserver
    container_name: configserver
    # ports:
    #   - "9999:9999"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_CLOUD_CONFIG_SERVER_MONITOR_GITHUB_WEBHOOKSECRET=${CONFIG_MONITOR_GITHUB_WEBHOOK_SECRET:?Set CONFIG_MONITOR_GITHUB_WEBHOOK_SECRET in .env}
    depends_on:
      rabbitmq:
        condition: service_started
    healthcheck:
      test: "curl --fail --silent localhost:9999/actuator/health | grep UP || exit 1"
      interval: 10s
      retries: 10
      start_period: 30s

  marques-ms:
    build: ./marque
    container_name: marques-ms
    # ports:
    #   - "8081:8081"
    environment:
      - DISCOVERY_SERVICE_URL=http://eurekaserver:8761/eureka
      - CONFIG_SERVICE_URL=http://configserver:9999
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_CLOUD_REFRESH_NEVER_REFRESHABLE=com.zaxxer.hikari.HikariDataSource,org.springframework.cloud.netflix.eureka.EurekaInstanceConfigBean
    healthcheck:
      test: "curl --fail --silent localhost:8081/actuator/health | grep UP || exit 1"
      interval: 10s
      retries: 10
      start_period: 30s
    depends_on:
      eurekaserver:
        condition: service_healthy
      configserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  postgres:
    image: postgres:16
    container_name: kc-postgres-dev
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - kc_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.4
    container_name: keycloak
    command: start-dev
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    ports:
      - "8090:8080"
    depends_on:
      - postgres

  gatewayserver:
    build: ./gatewayserver
    container_name: gatewayserver
    ports:
      - "8888:8888"
    environment:
      - DISCOVERY_SERVICE_URL=http://eurekaserver:8761/eureka
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_CLOUD_REFRESH_NEVER_REFRESHABLE=com.zaxxer.hikari.HikariDataSource,org.springframework.cloud.netflix.eureka.EurekaInstanceConfigBean
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/master/protocol/openid-connect/certs
    depends_on:
      eurekaserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      keycloak:
        condition: service_started

  voitures-ms:
    build: ./voiture-microservice
    container_name: voitures-ms
    # ports:
    #   - "8080:8080"
    environment:
      - DISCOVERY_SERVICE_URL=http://eurekaserver:8761/eureka
      - CONFIG_SERVICE_URL=http://configserver:9999
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_CLOUD_REFRESH_NEVER_REFRESHABLE=com.zaxxer.hikari.HikariDataSource,org.springframework.cloud.netflix.eureka.EurekaInstanceConfigBean
    depends_on:
      eurekaserver:
        condition: service_healthy
      configserver:
        condition: service_healthy
      marques-ms:
        condition: service_healthy
      rabbitmq:
        condition: service_started

volumes:
  kc_pg_data: